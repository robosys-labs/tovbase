name: Deploy to production

# Runs on:
#   - manual trigger (workflow_dispatch) — use this for first deploy + ad-hoc
#   - push to main on app/, scripts/, pyproject.toml — auto-deploy on backend changes
#
# Required repo secrets (set via `gh secret set <NAME>`):
#   SSH_PRIVATE_KEY     — content of venserve.pem (multi-line, paste raw text)
#   SSH_HOST            — server IP
#   SSH_PORT            — server SSH port
#   SSH_USER            — server username
#   REMOTE_DIR          — remote deployment directory

on:
  workflow_dispatch:
    inputs:
      skip_web:
        description: "Skip rebuilding the Next.js web container (recommended; production has divergent web/ tree)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "pyproject.toml"
      - "seeds/**"
      - "corpus/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + Deploy (backend, celery-worker, celery-beat)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build deployment archive
        run: |
          # Mirror scripts/deploy.py DEPLOY_EXCLUDES — production-owned files
          # (Dockerfile, docker-compose, nginx, migrations) stay on the server.
          tar --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='*.db' \
              --exclude='.env' \
              --exclude='.env.production.template' \
              --exclude='data' \
              --exclude='.claude' \
              --exclude='.pytest_cache' \
              --exclude='.ruff_cache' \
              --exclude='tovbase.egg-info' \
              --exclude='extension' \
              --exclude='tests' \
              --exclude='web/node_modules' \
              --exclude='web/.next' \
              --exclude='*.egg-info' \
              --exclude='.DS_Store' \
              --exclude='*.log' \
              --exclude='docker-compose.prod.yml' \
              --exclude='docker-compose.yml' \
              --exclude='nginx.conf' \
              --exclude='migrations' \
              --exclude='Dockerfile' \
              --exclude='Dockerfile.worker' \
              --exclude='deploy.tar' \
              --exclude='deploy_changes*.tar.gz' \
              --exclude='extension-key.pem' \
              --exclude='extension.pem' \
              --exclude='tovbase-extension-*.crx' \
              --exclude='tovbase-patch.tar.gz' \
              --exclude='tovbase-scoring-patch.tar.gz' \
              --exclude='tovbase-web-fix.tar.gz' \
              --exclude='update_env_oauth.py' \
              --exclude='_patch' \
              -czf /tmp/tovbase-deploy.tar.gz .
          ls -lh /tmp/tovbase-deploy.tar.gz

      - name: Upload + extract on server
        run: |
          scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy \
              /tmp/tovbase-deploy.tar.gz \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/tovbase-deploy-${{ github.sha }}.tar.gz
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "set -e; \
               cd ${{ secrets.REMOTE_DIR }}; \
               tar -xzf /tmp/tovbase-deploy-${{ github.sha }}.tar.gz; \
               rm -f /tmp/tovbase-deploy-${{ github.sha }}.tar.gz; \
               echo 'Extract complete'"

      - name: Build images
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cd ${{ secrets.REMOTE_DIR }} && \
               docker compose -f docker-compose.prod.yml build --pull \
                 backend celery-worker celery-beat"

      - name: Bring up data dependencies
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cd ${{ secrets.REMOTE_DIR }} && \
               docker compose -f docker-compose.prod.yml up -d postgres redis qdrant && \
               sleep 8"

      - name: Run v1.2 schema migration if present
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cd ${{ secrets.REMOTE_DIR }} && \
               if [ -f scripts/migrate_v12.py ]; then \
                 docker compose -f docker-compose.prod.yml run --rm \
                   --no-deps -T backend python scripts/migrate_v12.py; \
               else echo 'No migrate_v12.py — skipping'; fi"

      - name: Start application containers
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cd ${{ secrets.REMOTE_DIR }} && \
               docker compose -f docker-compose.prod.yml up -d \
                 backend celery-worker celery-beat"

      - name: Health check
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "set -e; \
               sleep 10; \
               docker compose -f ${{ secrets.REMOTE_DIR }}/docker-compose.prod.yml ps; \
               for i in 1 2 3 4 5; do \
                 STATUS=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9010/v1/health); \
                 if [ \"\$STATUS\" = \"200\" ]; then echo 'Backend healthy.'; exit 0; fi; \
                 echo \"Attempt \$i: backend returned \$STATUS, retrying...\"; \
                 sleep 5; \
               done; \
               echo 'Health check failed after 5 attempts.'; \
               docker compose -f ${{ secrets.REMOTE_DIR }}/docker-compose.prod.yml logs --tail=50 backend; \
               exit 1"

      - name: Rebuild + restart web (only when explicitly requested)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_web == 'false' }}
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cd ${{ secrets.REMOTE_DIR }} && \
               docker compose -f docker-compose.prod.yml build --pull web && \
               docker compose -f docker-compose.prod.yml up -d web"

      - name: Cleanup local key
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployment complete"
            echo ""
            echo "- Backend, celery-worker, celery-beat rebuilt + restarted"
            echo "- Schema migration applied (idempotent, when present)"
            echo "- Health check passed on http://127.0.0.1:9010/v1/health"
            echo "- Web container left untouched (production-divergent tree)"
            echo ""
            echo "**Live URLs**:"
            echo "- https://tovbase.com/v1/health"
            echo "- https://tovbase.com/docs (OpenAPI)"
          } >> "$GITHUB_STEP_SUMMARY"
