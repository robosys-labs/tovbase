# Trustgate seed list — anchors for the Personalized PageRank trust graph.
#
# Each entry is a (handle, platform) pair pointing to a verified, public,
# durably high-trust online identity. PPR teleports back to these nodes
# every iteration, so trust mass concentrates near them. A bad seed pollutes
# the entire graph; challenge any entry via PR with documented justification.
#
# Selection criteria (must satisfy ALL):
#   1. Public figure with a documented track record across multiple years.
#   2. Platform identity is verifiable (verified badge, OAuth, well-known
#      personal site cross-link).
#   3. No known major reputational incident.
#   4. Diversity across professional domains — avoid over-anchoring the
#      graph to one industry or culture.
#
# Governance: see GOVERNANCE.md. Changes to this file require a PR review
# from at least two maintainers and a public 14-day comment window.
#
# Version: 1
# Last updated: 2026-05-10

version: 1

